<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Fixed Demo — Deferred & Lazy Loading</title>
    <!-- Defer non-critical scripts (good) -->
    <script src="analytics.js" defer></script>
    <script src="chat-widget.js" defer></script>
</head>

<body>
    <h1>Hello world!</h1>
    <p>This is the fixed demo page. Non-critical resources are deferred or lazy-loaded.</p>

    <!-- Non-critical image lazy loaded (good) -->
    <!-- Fixed -->
    <img src="large-image.jpg" alt="img1" loading="lazy">
    <img src="large-image.jpg" alt="img2" loading="lazy">
    <img src="large-image.jpg" alt="img3" loading="lazy">
</body>

</html>
